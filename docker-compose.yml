services:
  jarvis-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jarvis-brain-server
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - JARVIS_DEFAULT_PROVIDER=groq
      - DEFAULT_MODEL=llama3-70b-8192
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - JARVIS_AUTH_TOKEN=${JARVIS_AUTH_TOKEN:-}
    volumes:
      - jarvis_memory_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  jarvis_memory_data:
